# TamPazar Nginx Reverse Proxy & SSL Configuration
# Location: /etc/nginx/sites-available/tampazar.com

server {
    listen 80;
    listen [::]:80;
    server_name tampazar.com www.tampazar.com;

    # HTTP'den HTTPS'e Otomatik Yönlendirme
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tampazar.com www.tampazar.com;

    # Certbot SSL Sertifika Yolları (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tampazar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tampazar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip Sıkıştırma
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Güvenlik Başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Statik Varlıklar (Cache Kontrolü)
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Node.js Express Sunucu Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Zaman Aşımı Ayarları
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
