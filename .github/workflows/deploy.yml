name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ${{ secrets.PROJECT_PATH }} 2>/dev/null || cd /var/www/tampazar-web 2>/dev/null || cd /var/www/tampazar 2>/dev/null || cd /root/tampazar-web 2>/dev/null || cd $(find / -name "package.json" -path "*/tampazar*/*" 2>/dev/null | head -n 1 | xargs dirname)

            pwd
            git pull origin main

            # Google API ve OAuth ortam değişkenlerini güvenli ekleme/güncelleme
            touch .env
            grep -q '^GEMINI_API_KEY=' .env && sed -i 's/^GEMINI_API_KEY=.*/GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}/' .env || echo 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' >> .env
            grep -q '^GOOGLE_MAPS_API_KEY=' .env && sed -i 's/^GOOGLE_MAPS_API_KEY=.*/GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}/' .env || echo 'GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}' >> .env
            grep -q '^GOOGLE_CLIENT_ID=' .env && sed -i 's/^GOOGLE_CLIENT_ID=.*/GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}/' .env || echo 'GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}' >> .env
            grep -q '^GOOGLE_CLIENT_SECRET=' .env && sed -i 's/^GOOGLE_CLIENT_SECRET=.*/GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}/' .env || echo 'GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}' >> .env

            npm install
            npm run build
            pm2 reload all || pm2 restart all
